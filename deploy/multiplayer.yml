---
# -----------------------------------------------------------------------------
# Unhaunter Multiplayer Stack Deployment Playbook
# -----------------------------------------------------------------------------
# This is an Ansible playbook. It automates the installation of the Hub, Process
# Manager, Dedicated game servers, and configures Caddy (HTTPS) and systemd.
#
# PREREQUISITES (on your dev machine):
#   1. Ansible installed: `sudo apt install ansible` (or via pip)
#   2. Rsync installed: `sudo apt install rsync`
#   3. Binaries compiled locally from the repository root:
#      `cargo build --release -p unhub -p unprocman -p unhaunter --bin unhub --bin unprocman --bin unhaunter_dedicated`
#
# HOW TO RUN:
#   ansible-playbook deploy/multiplayer.yml -i "hub.unhaunter.com," -u debian -e "domain=hub.unhaunter.com"
#
# TO ROTATE THE HMAC SECRET (after a security incident, invalidates all active connection tickets):
#   ansible-playbook deploy/multiplayer.yml -i "hub.unhaunter.com," -u debian -e "domain=hub.unhaunter.com rotate_hmac_secret=true"
#
# NOTES:
# - Replace `YOUR_SSH_USER` with a user that has sudo privileges on your server (e.g., debian, ubuntu, or root).
# - The trailing comma in the `-i` IP argument is required for Ansible to treat it as a host instead of a file.
# -----------------------------------------------------------------------------

- name: Deploy Unhaunter Multiplayer Stack
  hosts: all
  become: yes
  vars:
    # Set to 'localhost' if testing locally, or pass '-e domain=YOUR_DOMAIN' when running the playbook.
    caddy_domain: "{{ domain | default('localhost') }}"
    install_dir: "/opt/unhaunter"

    # Generate a consistent, idempotent UUID strictly tied to this server's hostname
    procman_uuid: "{{ inventory_hostname | to_uuid }}"

    # Set to true to rotate the HMAC secret on the next deploy:
    #   ansible-playbook deploy/multiplayer.yml ... -e rotate_hmac_secret=true
    # This will invalidate all active connection tickets and force a service restart.
    rotate_hmac_secret: false

    # Path to the locally compiled binaries and assets on your dev machine
    local_target: "../target/release"
    local_assets: "../assets"
    github_releases_api: "https://api.github.com/repos/deavid/unhaunter/releases"

  tasks:
    - name: Create unhaunter user
      user:
        name: unhaunter
        system: yes
        home: "{{ install_dir }}"
        shell: /bin/false

    - name: Ensure target directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: unhaunter
        group: unhaunter
        mode: "0755"
      loop:
        - "{{ install_dir }}"
        - "{{ install_dir }}/bin"
        - "{{ install_dir }}/library"
        - "{{ install_dir }}/library/stable"
        - "{{ install_dir }}/library/beta"
        - "{{ install_dir }}/library/alpha"
        - "{{ install_dir }}/library/dev"

    - name: Copy binaries from dev machine to server
      copy:
        src: "{{ local_target }}/{{ item }}"
        dest: "{{ install_dir }}/bin/{{ item }}"
        owner: unhaunter
        group: unhaunter
        mode: "0755"
      loop:
        - unhub
        - unprocman
      notify: Restart Services

    - name: Copy dev dedicated binary to library/dev
      copy:
        src: "{{ local_target }}/unhaunter_dedicated"
        dest: "{{ install_dir }}/library/dev/unhaunter_dedicated"
        owner: unhaunter
        group: unhaunter
        mode: "0755"

    - name: Sync dev assets directory to library/dev
      synchronize:
        src: "{{ local_assets }}/"
        dest: "{{ install_dir }}/library/dev/assets/"
        delete: yes
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--chown=unhaunter:unhaunter"
      delegate_to: localhost
      become: no

    - name: Fetch GitHub releases metadata
      uri:
        url: "{{ github_releases_api }}"
        return_content: yes
      register: github_releases

    - name: Select release candidates for stable, beta, and alpha
      set_fact:
        stable_release:
          "{{ (github_releases.json | rejectattr('draft', 'equalto', true) | rejectattr('prerelease', 'equalto', true) |
          list | first) | default({}) }}"
        beta_release:
          "{{ (github_releases.json | rejectattr('draft', 'equalto', true) | selectattr('prerelease', 'equalto', true) |
          selectattr('tag_name', 'search', '-beta') | list | first) | default({}) }}"
        alpha_release:
          "{{ (github_releases.json | rejectattr('draft', 'equalto', true) | selectattr('tag_name', 'equalto',
          'alpha-latest') | list | first) | default({}) }}"

    - name: Select server assets for stable, beta, and alpha
      set_fact:
        stable_asset:
          "{{ (stable_release.assets | default([]) | selectattr('name', 'match',
          '^unhaunter-.*-server-linux-x86_64\\.tar\\.gz$') | list | first) | default({}) }}"
        beta_asset:
          "{{ (beta_release.assets | default([]) | selectattr('name', 'match',
          '^unhaunter-.*-server-linux-x86_64\\.tar\\.gz$') | list | first) | default({}) }}"
        alpha_asset:
          "{{ (alpha_release.assets | default([]) | selectattr('name', 'match',
          '^unhaunter-.*-server-linux-x86_64\\.tar\\.gz$') | list | first) | default({}) }}"

    - name: Compute release versions and destination paths
      set_fact:
        stable_version: "{{ (stable_release.tag_name | default('') | regex_replace('^v', '')) }}"
        beta_version: "{{ (beta_release.tag_name | default('') | regex_replace('^v', '')) }}"
        stable_dir:
          "{{ install_dir }}/library/stable/{{ (stable_release.tag_name | default('') | regex_replace('^v', '')) }}"
        beta_dir: "{{ install_dir }}/library/beta/{{ (beta_release.tag_name | default('') | regex_replace('^v', '')) }}"
        alpha_dir: "{{ install_dir }}/library/alpha"

    - name: Check if stable version is already installed
      stat:
        path: "{{ stable_dir }}/VERSION"
      register: stable_installed
      when: stable_asset.browser_download_url is defined and stable_version | length > 0

    - name: Check if beta version is already installed
      stat:
        path: "{{ beta_dir }}/VERSION"
      register: beta_installed
      when: beta_asset.browser_download_url is defined and beta_version | length > 0

    - name: Download latest stable server bundle
      get_url:
        url: "{{ stable_asset.browser_download_url }}"
        dest: "/tmp/unhaunter-stable-server.tar.gz"
        mode: "0644"
      when:
        - stable_asset.browser_download_url is defined
        - stable_version | length > 0
        - not (stable_installed.stat.exists | default(false))

    - name: Extract latest stable server bundle
      unarchive:
        src: "/tmp/unhaunter-stable-server.tar.gz"
        dest: "{{ stable_dir }}"
        remote_src: yes
        owner: unhaunter
        group: unhaunter
      when:
        - stable_asset.browser_download_url is defined
        - stable_version | length > 0
        - not (stable_installed.stat.exists | default(false))

    - name: Download latest beta server bundle
      get_url:
        url: "{{ beta_asset.browser_download_url }}"
        dest: "/tmp/unhaunter-beta-server.tar.gz"
        mode: "0644"
      when:
        - beta_asset.browser_download_url is defined
        - beta_version | length > 0
        - not (beta_installed.stat.exists | default(false))

    - name: Extract latest beta server bundle
      unarchive:
        src: "/tmp/unhaunter-beta-server.tar.gz"
        dest: "{{ beta_dir }}"
        remote_src: yes
        owner: unhaunter
        group: unhaunter
      when:
        - beta_asset.browser_download_url is defined
        - beta_version | length > 0
        - not (beta_installed.stat.exists | default(false))

    - name: Remove old alpha bundle before overwrite
      file:
        path: "{{ alpha_dir }}"
        state: absent
      when: alpha_asset.browser_download_url is defined

    - name: Recreate alpha directory
      file:
        path: "{{ alpha_dir }}"
        state: directory
        owner: unhaunter
        group: unhaunter
        mode: "0755"
      when: alpha_asset.browser_download_url is defined

    - name: Download rolling alpha server bundle
      get_url:
        url: "{{ alpha_asset.browser_download_url }}"
        dest: "/tmp/unhaunter-alpha-server.tar.gz"
        mode: "0644"
      when: alpha_asset.browser_download_url is defined

    - name: Extract rolling alpha server bundle
      unarchive:
        src: "/tmp/unhaunter-alpha-server.tar.gz"
        dest: "{{ alpha_dir }}"
        remote_src: yes
        owner: unhaunter
        group: unhaunter
      when: alpha_asset.browser_download_url is defined

    - name: Ensure stable metadata files
      shell: |
        set -euo pipefail
        ./unhaunter_dedicated --print-version > VERSION
        ./unhaunter_dedicated --print-protocol-hash > PROTOCOL_HASH
      args:
        chdir: "{{ stable_dir }}"
      when:
        - stable_version | length > 0
        - stable_asset.browser_download_url is defined
        - not (stable_installed.stat.exists | default(false))

    - name: Ensure beta metadata files
      shell: |
        set -euo pipefail
        ./unhaunter_dedicated --print-version > VERSION
        ./unhaunter_dedicated --print-protocol-hash > PROTOCOL_HASH
      args:
        chdir: "{{ beta_dir }}"
      when:
        - beta_version | length > 0
        - beta_asset.browser_download_url is defined
        - not (beta_installed.stat.exists | default(false))

    - name: Ensure alpha metadata files
      shell: |
        set -euo pipefail
        ./unhaunter_dedicated --print-version > VERSION
        ./unhaunter_dedicated --print-protocol-hash > PROTOCOL_HASH
      args:
        chdir: "{{ alpha_dir }}"
      when: alpha_asset.browser_download_url is defined

    - name: Ensure dev metadata files
      shell: |
        set -euo pipefail
        ./unhaunter_dedicated --print-version > VERSION
        ./unhaunter_dedicated --print-protocol-hash > PROTOCOL_HASH
      args:
        chdir: "{{ install_dir }}/library/dev"

    - name: Retention cleanup for stable channel
      shell: |
        set -euo pipefail
        channel_dir="{{ install_dir }}/library/stable"
        cd "$channel_dir"

        mapfile -t versions < <(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V)
        if [ "${#versions[@]}" -eq 0 ]; then
          exit 0
        fi

        minor_of() {
          local v="$1"
          local major="${v%%.*}"
          local rest="${v#*.}"
          local minor="${rest%%.*}"
          echo "${major}.${minor}"
        }

        latest="${versions[-1]}"
        latest_minor="$(minor_of "$latest")"

        declare -A keep=()
        keep["$latest"]=1

        declare -a running_versions=()
        while IFS= read -r rv; do
          [ -n "$rv" ] && running_versions+=("$rv")
        done < <(
          for exe in /proc/[0-9]*/exe; do
            target="$(readlink -f "$exe" 2>/dev/null || true)"
            case "$target" in
              "{{ install_dir }}/library/stable/"*/unhaunter_dedicated)
                ver="${target#{{ install_dir }}/library/stable/}"
                ver="${ver%%/*}"
                echo "$ver"
                ;;
            esac
          done | sort -u
        )

        declare -a current_minor_versions=()
        declare -a other_minor_versions=()
        for v in "${versions[@]}"; do
          if [ "$(minor_of "$v")" = "$latest_minor" ]; then
            current_minor_versions+=("$v")
          else
            other_minor_versions+=("$v")
          fi
        done

        if [ "${#current_minor_versions[@]}" -ge 2 ]; then
          prev_patch="${current_minor_versions[-2]}"
          latest_hash_file="$latest/PROTOCOL_HASH"
          prev_hash_file="$prev_patch/PROTOCOL_HASH"
          if [ -f "$latest_hash_file" ] && [ -f "$prev_hash_file" ]; then
            latest_hash="$(cat "$latest_hash_file")"
            prev_hash="$(cat "$prev_hash_file")"
            if [ "$latest_hash" != "$prev_hash" ]; then
              keep["$prev_patch"]=1
            fi
          fi
        fi

        if [ "${#other_minor_versions[@]}" -gt 0 ]; then
          mapfile -t other_minors < <(for v in "${other_minor_versions[@]}"; do minor_of "$v"; done | sort -Vu)
          prev_minor="${other_minors[-1]}"
          declare -a prev_minor_versions=()
          for v in "${other_minor_versions[@]}"; do
            if [ "$(minor_of "$v")" = "$prev_minor" ]; then
              prev_minor_versions+=("$v")
            fi
          done
          if [ "${#prev_minor_versions[@]}" -gt 0 ]; then
            keep["${prev_minor_versions[-1]}"]=1
          fi
        fi

        for rv in "${running_versions[@]}"; do
          keep["$rv"]=1
        done

        for v in "${versions[@]}"; do
          if [ -z "${keep[$v]:-}" ]; then
            rm -rf "$v"
          fi
        done
      args:
        executable: /bin/bash

    - name: Retention cleanup for beta channel
      shell: |
        set -euo pipefail
        channel_dir="{{ install_dir }}/library/beta"
        cd "$channel_dir"

        mapfile -t versions < <(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V)
        if [ "${#versions[@]}" -eq 0 ]; then
          exit 0
        fi

        declare -A keep=()
        declare -A seen_hash=()

        declare -a running_versions=()
        while IFS= read -r rv; do
          [ -n "$rv" ] && running_versions+=("$rv")
        done < <(
          for exe in /proc/[0-9]*/exe; do
            target="$(readlink -f "$exe" 2>/dev/null || true)"
            case "$target" in
              "{{ install_dir }}/library/beta/"*/unhaunter_dedicated)
                ver="${target#{{ install_dir }}/library/beta/}"
                ver="${ver%%/*}"
                echo "$ver"
                ;;
            esac
          done | sort -u
        )

        for (( idx=${#versions[@]}-1; idx>=0; idx-- )); do
          v="${versions[$idx]}"
          hash_file="$v/PROTOCOL_HASH"
          if [ ! -f "$hash_file" ]; then
            continue
          fi
          hash="$(cat "$hash_file")"
          if [ -z "${seen_hash[$hash]:-}" ] && [ "${#seen_hash[@]}" -lt 3 ]; then
            keep["$v"]=1
            seen_hash["$hash"]=1
          fi
        done

        for rv in "${running_versions[@]}"; do
          keep["$rv"]=1
        done

        for v in "${versions[@]}"; do
          if [ -z "${keep[$v]:-}" ]; then
            rm -rf "$v"
          fi
        done
      args:
        executable: /bin/bash

    - name: Check if unprocman is active
      shell: systemctl is-active unprocman
      register: unprocman_is_active
      changed_when: false
      failed_when: false

    - name: Signal unprocman to reload library (SIGHUP)
      shell: systemctl kill -s HUP unprocman
      when: unprocman_is_active.stdout == "active"

    # --- HMAC Secret Management ---
    - name: Ensure secrets directory exists
      file:
        path: "{{ install_dir }}/secrets"
        state: directory
        owner: unhaunter
        group: unhaunter
        mode: "0700"

    - name: Rotate HMAC secret (only when rotate_hmac_secret=true)
      file:
        path: "{{ install_dir }}/secrets/procman_hmac_secret"
        state: absent
      when: rotate_hmac_secret | bool
      notify: Restart Services

    - name: Check if HMAC secret file exists
      stat:
        path: "{{ install_dir }}/secrets/procman_hmac_secret"
      register: hmac_secret_stat

    - name: Generate HMAC secret (first deploy or after rotation)
      shell: "openssl rand -hex 32 > {{ install_dir }}/secrets/procman_hmac_secret"
      when: not hmac_secret_stat.stat.exists
      notify: Restart Services

    - name: Lock down HMAC secret file permissions
      file:
        path: "{{ install_dir }}/secrets/procman_hmac_secret"
        owner: unhaunter
        group: unhaunter
        mode: "0600"

    - name: Read HMAC secret into fact
      slurp:
        src: "{{ install_dir }}/secrets/procman_hmac_secret"
      register: hmac_secret_slurp

    - name: Set procman_hmac_secret fact
      set_fact:
        procman_hmac_secret: "{{ hmac_secret_slurp.content | b64decode | trim }}"

    # --- Bypass the Bootstrap Dance ---
    - name: Template hub_config.ron
      copy:
        dest: "{{ install_dir }}/hub_config.ron"
        content: |
          (
              version: 1,
              api_bind: "127.0.0.1:3000",
              procman_bind: "127.0.0.1:11000",
              official_server_keys: {},
              banned_uuids: [],
              allowed_procman_uuids: ["{{ procman_uuid }}"],
              max_rooms_per_ip: 20,
              trust_proxy_headers: true,
              pow_difficulty: 20,
          )
        owner: unhaunter
        group: unhaunter
      notify: Restart Services

    - name: Template procman_config.ron
      copy:
        dest: "{{ install_dir }}/procman_config.ron"
        content: |
          (
              hub_addr: "127.0.0.1:11000",
              public_addr: "{{ inventory_hostname }}",
              installation_id: "{{ procman_uuid }}",
              ticket_hmac_secret: "{{ procman_hmac_secret }}",
              port_range: (12000, 12100),
              library_dir: "{{ install_dir }}/library",
              max_total_instances: 8,
          )
        owner: unhaunter
        group: unhaunter
      notify: Restart Services

    # --- Caddy & Security ---
    - name: Install prerequisite packages for Caddy
      apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present

    - name: Add Caddy GPG key
      shell:
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o
        /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    - name: Add Caddy repository
      shell:
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee
        /etc/apt/sources.list.d/caddy-stable.list
      args:
        creates: /etc/apt/sources.list.d/caddy-stable.list

    - name: Install Caddy
      apt:
        name: caddy
        state: present
        update_cache: yes

    - name: Configure Caddy (HTTPS & Reverse Proxy)
      copy:
        dest: /etc/caddy/Caddyfile
        content: |
          {{ caddy_domain }} {
              reverse_proxy 127.0.0.1:3000
          }
      notify: Reload Caddy

    # --- Setup Systemd ---
    - name: Template Systemd services
      copy:
        dest: "/etc/systemd/system/{{ item.name }}.service"
        content: |
          [Unit]
          Description=Unhaunter {{ item.name }}
          After=network.target

          [Service]
          Type=simple
          User=unhaunter
          WorkingDirectory={{ install_dir }}
          ExecStart={{ install_dir }}/bin/{{ item.name }}
          Restart=always
          RestartSec=5
          Environment=RUST_LOG=debug
          Environment=BEVY_ASSET_ROOT={{ install_dir }}

          [Install]
          WantedBy=multi-user.target
      loop:
        - { name: "unhub" }
        - { name: "unprocman" }
      notify: Restart Services

    - name: Enable and start systemd services
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
        daemon_reload: yes
      loop:
        - unhub
        - unprocman

  handlers:
    - name: Restart Services
      systemd:
        name: "{{ item }}"
        state: restarted
        daemon_reload: yes
      loop:
        - unhub
        - unprocman

    - name: Reload Caddy
      systemd:
        name: caddy
        state: reloaded

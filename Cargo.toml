[package]
name = "unhaunter"
default-run = "unhaunter_game"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
wasm-bindgen = { workspace = true }
bevy = { workspace = true }

untypes-core = { workspace = true }
untmxmap-core = { workspace = true }
uncampaign-plugin = { workspace = true }
unboard-plugin = { workspace = true }
unaudiobg-plugin = { workspace = true }
unclassic-mode-gameplay-plugin = { workspace = true }
unclassic-mode-orchestrator-plugin = { workspace = true }
unclassic-mode-render-plugin = { workspace = true }
unclassic-mode-ui-plugin = { workspace = true }
unfog-plugin = { workspace = true }
unfps-plugin = { workspace = true }
ungear-plugin = { workspace = true }
ungearitems-plugin = { workspace = true }
unghost-plugin = { workspace = true }

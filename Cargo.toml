#     "2d_bevy_render",
#     "audio",
#     "default_app",
#     "picking",
#     "scene",
#     # UI
#     "ui_api",
#     "ui_bevy_render",
# ] }
bevy_asset_loader = { version = "0.25", features = ["2d"] }
bevy_math = "0.18"
bevy-persistent = { version = "0.10", features = ["all"] }
bevy_platform = "0.18"
bevy_dylib = "0.18"
bevy_picking = "0.18"
ndarray = "0.17"
sha2 = "0.10"
rayon = "1.11"
crossbeam-channel = "0.5"
uuid = { version = "1.21", features = ["v4", "serde"] }
bevy_replicon = "0.39"
bevy_replicon_renet = "0.15"
bevy_renet = { version = "4.0", features = ["netcode"] }
renet = "2.0"
renet_netcode = "2.0"
postcard = { version = "1.1", features = ["alloc"] }
hmac = "0.12"
reqwest = { version = "0.13", features = ["json"] }
axum = "0.8"
tokio = { version = "1.50", features = ["full"] }
dashmap = "6.1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
base64 = "0.22"


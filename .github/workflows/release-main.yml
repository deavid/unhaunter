name: Release Main Build

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Trigger on final version tags like v0.3.0

permissions:
  contents: write # Required for gh release upload
  actions: write # Required to trigger the website deployment

jobs:
  prepare_assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update APT & Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick bc xbrzscale

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Cache upscaled assets
        uses: actions/cache@v4
        with:
          path: |
            assets/upscaled
            assets/index.postcard
          key: ${{ runner.os }}-assets-${{ hashFiles('assets/img/**', 'upscale_assets.sh') }}
          restore-keys: |
            ${{ runner.os }}-assets-

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Process assets
        run: just upscale-assets

      - name: Upload processed assets
        uses: actions/upload-artifact@v4
        with:
          name: processed-assets-main
          path: assets/
          include-hidden-files: true

  build_and_package:
    runs-on: ubuntu-latest
    needs: [prepare_assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            just_target: package-linux
          - id: windows
            just_target: package-windows
          - id: wasm
            just_target: package-wasm
          - id: server
            just_target: package-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download processed assets
        uses: actions/download-artifact@v4
        with:
          name: processed-assets-main
          path: assets/

      - name: Update APT & Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 mingw-w64 zip imagemagick bc xbrzscale

      - name: Install WASM deps
        run: |
          cargo install wasm-pack

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu,wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Build and Package
        env:
          SKIP_UPSCALE: 1
        run: just ${{ matrix.just_target }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: main-${{ matrix.id }}
          path: releases/unhaunter-*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build_and_package]
    steps:
      - name: Checkout code (tagged commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_changelog
        run: |
          NOTES=$(./extract_changelog_section.sh "${{ steps.get_version.outputs.VERSION }}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ steps.get_version.outputs.VERSION }}. Please see the full changelog file."
          fi
          # Escape newlines for multiline notes in GitHub Actions output
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "RELEASE_NOTES=$NOTES" >> $GITHUB_OUTPUT
        shell: bash

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: main-*
          merge-multiple: true
          path: releases

      - name: Create GitHub Release and Upload Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.extract_changelog.outputs.RELEASE_NOTES }}
        run: |
          gh release create $TAG_NAME \
            --repo ${{ github.repository }} \
            --latest \
            --title "Unhaunter ${{ steps.get_version.outputs.VERSION }}" \
            --notes "$RELEASE_NOTES" \
            releases/unhaunter-*

      - name: Trigger Website Deployment
        run: gh workflow run deploy-zola-site.yml --repo ${{ github.repository }} --ref website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

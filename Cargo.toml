resolver = "3"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.package]
version = "0.3.2-dev"
edition = "2024"
description = "2D isometric Game about investigating paranormal hauntings"
repository = "https://github.com/deavid/unhaunter/"
license = "Apache-2.0"
authors = ["David Martínez Martí <deavidsedice@gmail.com>"]
homepage = "https://unhaunter.com"

[workspace.dependencies]
rand = { version = "0.10", default-features = false, features = [
    "alloc",
    "std_rng",
    "thread_rng",
] }
rand_distr = "0.6"
enum-iterator = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
image = "0.25"
regex = "1.12"
clap = { version = "4.5", features = ["derive"] }
fastapprox = "0.3"
anyhow = "1.0"
thiserror = "2.0"
ordered-float = { version = "5.1", features = ["serde"] }
hierarchical_pathfinding = "0.5"
walkdir = "2.5"
glob = "0.3"
tiled = { version = "0.15", default-features = false }
wasm-bindgen = "0.2"
normalize-path = "0.2"
itertools = "0.14"
csv = "1.4"
dirs = "6.0"
strum = { version = "0.28", features = ["derive"] }
noise = { version = "0.9", features = ["std"] }
bevy = { version = "0.18", features = ["jpeg", "serialize", "debug"] }
# bevy = { version = "0.18", default-features = false, features = [
#     "jpeg",
#     "serialize",
#     "debug",

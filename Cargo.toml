[workspace]
members = [
    "crates/uncampaign-plugin",
    "crates/uncore-foundation",
    "crates/uncore-board",
    "crates/uncore-assets",
    "crates/uncore-events",
    "crates/uncore-types",
    "crates/uncore-resources",
    "crates/unmetrics",
    "crates/undifficulty",
    "crates/uncoremenu",
    "crates/unfog",
    "crates/ungear",
    "crates/ungearitems",
    "crates/unghost",
    "crates/unghost-core",
    "crates/unlight",
    "crates/unmapload-plugin",
    "crates/unmaphub",
    "crates/unmenu-plugin",
    "crates/unmenusettings-plugin",
    "crates/unnpc-plugin",
    "crates/unnavigation",
    "crates/unui",
    "crates/unnoise",
    "crates/untiled",
    "crates/unmanual-plugin",
    "crates/unpicking",
    "crates/unroot-plugin",
    "crates/unplayer",
    "crates/unplayer-core",
    "crates/unrender",
    "crates/unprofile",
    "crates/unsettings",
    "crates/unsummary",
    "crates/untruck",
    "crates/untmxmap-plugin",
    "crates/unwalkie-plugin",
    "crates/unwalkiecore",
    "crates/unspatial",
    "crates/untags",
    "crates/uninteraction",
    "crates/ungame-plugin",
    "crates/tools/ghost_list",
    "crates/tools/ghost_radio",
    "crates/tools/text_to_speech/walkie_voice_generator", "crates/unfog-core",
]
resolver = "3"

[workspace.package]
version = "0.3.2-dev"
edition = "2024"
description = "2D isometric Game about investigating paranormal hauntings"
repository = "https://github.com/deavid/unhaunter/"
license = "Apache-2.0"
authors = ["David Martínez Martí <deavidsedice@gmail.com>"]
homepage = "https://unhaunter.com"

[workspace.dependencies]
rand = { version = "0.9", default-features = false, features = [
    "small_rng",
    "alloc",
    "std_rng",
] }
rand_distr = "0.5"
enum-iterator = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
image = "0.25"
regex = "1.12"
clap = "4.5"
fastapprox = "0.3"
anyhow = "1.0"
thiserror = "2.0"
ordered-float = { version = "5.1", features = ["serde"] }
hierarchical_pathfinding = "0.5"
walkdir = "2.5"
glob = "0.3"
tiled = { version = "0.15", default-features = false }
wasm-bindgen = "0.2"
normalize-path = "0.2"
itertools = "0.14.0"
csv = "1.4"
dirs = "6.0"
strum = { version = "0.27", features = ["derive"] }
noise = { version = "0.9.0", features = ["std"] }
bevy = { version = "0.17", features = ["jpeg", "serialize"] }
bevy-persistent = { version = "0.9", features = ["all"] }
bevy_platform = "0.17"
bevy_framepace = "0.20"
bevy_dylib = "0.17"
bevy_picking = "0.17"
ndarray = "0.17"
sha2 = "0.10"
rayon = "1.11"

# winit is not for WASM, and needs to be in sync with bevy version
winit = "0.30"

[package]
name = "unhaunter"
default-run = "unhaunter_game"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
uncampaign-plugin = { path = "crates/uncampaign-plugin" }
undifficulty = { path = "crates/undifficulty" }
uncore-foundation = { path = "crates/uncore-foundation" }
uncore-assets = { path = "crates/uncore-assets" }
uncore-resources = { path = "crates/uncore-resources" }
uncoremenu = { path = "crates/uncoremenu" }
unfog = { path = "crates/unfog" }
ungear = { path = "crates/ungear" }
ungearitems = { path = "crates/ungearitems" }
unghost = { path = "crates/unghost" }
unlight = { path = "crates/unlight" }
unmapload-plugin = { path = "crates/unmapload-plugin" }
unmaphub = { path = "crates/unmaphub" }
unmenu-plugin = { path = "crates/unmenu-plugin" }
unmenusettings-plugin = { path = "crates/unmenusettings-plugin" }
unnpc-plugin = { path = "crates/unnpc-plugin" }
unplayer = { path = "crates/unplayer" }
unplayer-core = { path = "crates/unplayer-core" }
unprofile = { path = "crates/unprofile" }
unsettings = { path = "crates/unsettings" }
unsummary = { path = "crates/unsummary" }
unrender = { path = "crates/unrender" }
unmanual-plugin = { path = "crates/unmanual-plugin" }
unpicking = { path = "crates/unpicking" }
unroot-plugin = { path = "crates/unroot-plugin" }
untiled = { path = "crates/untiled" }
untruck = { path = "crates/untruck" }
untmxmap-plugin = { path = "crates/untmxmap-plugin" }
unwalkie-plugin = { path = "crates/unwalkie-plugin" }
unghost-core = { path = "crates/unghost-core" }
unwalkie_types = { path = "crates/unwalkie_types" }
ungame-plugin = { path = "crates/ungame-plugin" }

clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
ron = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }

wasm-bindgen = { workspace = true }
bevy = { workspace = true }
ordered-float = { workspace = true }
walkdir = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "unhaunter_game"
path = "unhaunter/src/bin/unhaunter.rs"

[[bin]]
name = "walkie_voice_generator"
path = "crates/tools/text_to_speech/walkie_voice_generator/src/main.rs"
required-features = []

[lib]
crate-type = ["cdylib", "rlib"]
path = "unhaunter/src/lib.rs"

[target.'cfg(target_os = "linux")'.dependencies]
bevy_dylib = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = { workspace = true }
image = { workspace = true }

[profile.dev]
opt-level = "s"
lto = false
debug-assertions = true
overflow-checks = true

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = "s"
debug = false
strip = "debuginfo"
codegen-units = 1

debug-assertions = true
overflow-checks = true

# These optimizations for release are trying to target mostly WASM
[profile.release]
opt-level = "s"
# TODO: When WASM gets its own release profile we will keep some debug info to do profiling as well on release.
debug = false
strip = "debuginfo"
# --
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 1

# TODO: wasm-pack v0.13.2 or v0.14.0 is going to implement custom profiles with --profile $PROFILE.
# This will allow us to have a custom profile for WASM builds, and then make it much more aggressive.

[profile.release.package."*"]
opt-level = "s"
debug = false
strip = "debuginfo"
debug-assertions = false
overflow-checks = false
codegen-units = 1

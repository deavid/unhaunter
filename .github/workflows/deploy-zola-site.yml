# .github/workflows/deploy-zola-site.yml (Modified - Stage 1: Include WASM)
name: Deploy Zola Website with WASM to GitHub Pages

on:
  push:
    branches:
      - website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4

      - name: Install Zola CLI
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.1

      # === WASM STABLE GAME FETCHING STEPS ===
      - name: Get Latest Stable Release Tag
        id: latest_release
        run: |
          # Get the latest release tag (excluding pre-releases)
          LATEST_TAG=$(gh release list --limit 1 --exclude-pre-releases --json tagName --jq '.[0].tagName' || echo "none")
          echo "Latest Release Tag: $LATEST_TAG"
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Latest Stable WASM Game
        if: steps.latest_release.outputs.LATEST_TAG != 'none' && steps.latest_release.outputs.LATEST_TAG != 'null'
        run: |
          gh release download "${{ steps.latest_release.outputs.LATEST_TAG }}" --pattern "unhaunter-*wasm.zip" -O latest-wasm-release.zip
          unzip latest-wasm-release.zip -d wasm-release-temp
          GAME_DIR=$(find wasm-release-temp -name "index.html" | head -n 1)
          if [ -n "$GAME_DIR" ]; then
            cp -Rv "$(dirname "$GAME_DIR")"/* static/wasm/main/
          else
            echo "Error: index.html not found in stable release zip"
            exit 1
          fi
          echo "Latest stable WASM game downloaded and extracted to static/wasm/main/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup temp WASM download
        if: steps.latest_release.outputs.LATEST_TAG != 'none' && steps.latest_release.outputs.LATEST_TAG != 'null'
        run: rm -rf wasm-release-temp latest-wasm-release.zip

      # === WASM BETA GAME FETCHING STEPS ===
      - name: Get Latest Beta Release Tag
        id: latest_beta_release
        run: |
          # Get the latest release tag that contains "-beta"
          BETA_TAG=$(gh release list --limit 50 --json tagName --jq '.[] | select(.tagName | contains("-beta")) | .tagName' | head -n 1)
          if [ -z "$BETA_TAG" ]; then BETA_TAG="none"; fi
          echo "Latest Beta Release Tag: $BETA_TAG"
          echo "BETA_TAG=$BETA_TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Latest Beta WASM Game
        if: steps.latest_beta_release.outputs.BETA_TAG != 'none' && steps.latest_beta_release.outputs.BETA_TAG != 'null'
        run: |
          gh release download "${{ steps.latest_beta_release.outputs.BETA_TAG }}" --pattern "unhaunter-*wasm.zip" -O beta-wasm-release.zip
          unzip beta-wasm-release.zip -d wasm-beta-temp
          GAME_DIR=$(find wasm-beta-temp -name "index.html" | head -n 1)
          if [ -n "$GAME_DIR" ]; then
            cp -Rv "$(dirname "$GAME_DIR")"/* static/wasm/beta/
          else
            echo "Error: index.html not found in beta release zip"
            exit 1
          fi
          echo "Latest beta WASM game downloaded and extracted to static/wasm/beta/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup temp WASM download
        if: steps.latest_beta_release.outputs.BETA_TAG != 'none' && steps.latest_beta_release.outputs.BETA_TAG != 'null'
        run: rm -rf wasm-beta-temp beta-wasm-release.zip

      # === WASM ALPHA GAME FETCHING STEPS ===
      - name: Download Latest Alpha WASM Game
        run: |
          # Fetch the rolling alpha-latest release from the main repo
          gh release download "alpha-latest" --repo deavid/unhaunter --pattern "unhaunter-*wasm.zip" -O alpha-wasm-release.zip || echo "Alpha release not found, skipping."

          if [ -f alpha-wasm-release.zip ]; then
            unzip alpha-wasm-release.zip -d wasm-alpha-temp
            GAME_DIR=$(find wasm-alpha-temp -name "index.html" | head -n 1)
            if [ -n "$GAME_DIR" ]; then
              mkdir -p static/wasm/alpha/
              cp -Rv "$(dirname "$GAME_DIR")"/* static/wasm/alpha/
            else
              echo "Error: index.html not found in alpha release zip"
              exit 1
            fi
            rm -rf wasm-alpha-temp alpha-wasm-release.zip
            echo "Latest alpha WASM game downloaded and extracted to static/wasm/alpha/"
          else
            echo "No alpha WASM found to download."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # === BUILD SITE AND UPLOAD ====
      - name: Build Zola site
        run: zola build
        # Zola will now include the WASM game from static/wasm/main/pkg

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public # Upload 'public' directory

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

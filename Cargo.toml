[workspace]
members = [
    # ── Tools ────────────────────────────────────────────────────────────────
    # Development / build-time utilities; not part of the game runtime.
    "crates/tools/ghost_list",
    "crates/tools/ghost_radio",
    "crates/tools/unhub",
    "crates/tools/unprocman",
    "crates/tools/text_to_speech/walkie_voice_generator",

    # ── Portable Libraries ─────────────────────────────────────────────────
    # Game-agnostic Bevy plugins. Zero Unhaunter-specific knowledge.
    # Strong candidates for extraction to crates.io. No -core/-plugin split.
    # These are the foundation the tier stack rests on — outside the hexagon.
    "crates/unfps-plugin", # Frame-rate limiter via std::thread::sleep

    # ════════════════════════════════════════════════════════════════════════
    # Tier 0 · Domain Kernel
    # Pure primitives: types, math, and markers.
    # Zero internal game dependencies. Dependency arrow points here.
    # ════════════════════════════════════════════════════════════════════════
    "crates/uncommon-app-core",    # Base platform utilities and basic types
    "crates/uncommon-states-core",
    "crates/unspatial-core",       # Coordinate math (isometric, Position, Direction)
    "crates/unnoise-core",         # Procedural noise math (Perlin)
    "crates/unmetrics-core",       # Performance diagnostic data structures
    "crates/unmetrics-plugin",     # Diagnostic systems
    "crates/unsettings-core",      # Persistent configuration data (pure data, no game deps)
    "crates/uninvestigation-core", # Investigation primitives: evidence and ghost identity enums

    # ════════════════════════════════════════════════════════════════════════
    # Tier 1 · Domain Core
    # The game's primary domain: its world and rules. Headless-safe.
    # Depends only on T0. These pairs (-core/-plugin) are one bounded context.
    # ════════════════════════════════════════════════════════════════════════

    # ── 1a: The Stage (World & Physics) ──────────────────────────────────
    # The persistent physical world that all actors inhabit.
    "crates/unboard-core",        # World topology: rooms, walls, collision fields
    "crates/unboard-plugin",
    "crates/unbehavior-core",     # Tile ontology: Behavior, Class, Properties, marker components
    "crates/unthermal-core",      # Heat convection simulation
    "crates/unthermal-plugin",
    "crates/unsoundfield-core",   # Sound propagation simulation
    "crates/unsoundfield-plugin",
    "crates/unfog-core",          # Miasma fog
    "crates/unfog-plugin",
    "crates/unlight-core",        # Illumination model
    "crates/unlight-plugin",
    "crates/unnavigation-core",   # Pathfinding graph (data only, no systems)
    "crates/unreplicon-core",     # Networking / replication
    "crates/unreplicon-plugin",

    # ── 1b: The Actors (Entities & AI) ───────────────────────────────────
    # Everything that inhabits and acts within the stage.
    "crates/unghost-core",        # Ghost: evidence types, enrage state, AI data
    "crates/unghost-plugin",      # Ghost: simulation logic (package name: unghost-logic)
    "crates/unplayer-core",       # Player: state, stats, asset handles
    "crates/unplayer-plugin",
    "crates/uninput-core",        # Input bus (TIER EXCEPTION: T1b despite T2 plugin; domain state, not app logic)
    "crates/unnpc-plugin",        # Helper NPCs
    "crates/unlocomotion-core",   # Locomotion state component
    "crates/unlocomotion-plugin", # Kinematics and movement integration
    "crates/unnavigation-plugin", # Waypoint creation and pathfinding integration
    "crates/unclassic-mode-core", # Classic (phasmo-style) mode shared types: camera marker, game colors

    # ── 1c: The Mechanics (Gameplay Verbs) ───────────────────────────────
    # How actors interact with the world and each other.
    "crates/ungear-core",          # Item framework: traits and slots
    "crates/ungear-plugin",
    "crates/ungearitems-core",     # Concrete items: EMF reader, thermometer, etc.
    "crates/ungearitems-plugin",
    "crates/uninteraction-core",   # Entity toggling and triggering
    "crates/uninteraction-plugin",
    "crates/uninventory-plugin",   # Hand / pocket item management
    "crates/unvitals-core",        # Player health and sanity state
    "crates/unvitals-plugin",      # Health and sanity simulation
    "crates/undifficulty-core",    # Difficulty enum and math traits
    "crates/undifficulty-plugin",
    "crates/untruck-core",         # Mission loadout and journal state
    "crates/untruck-plugin",
    "crates/unwalkie-core",        # Walkie-talkie communication mechanics
    "crates/unwalkie-plugin",
    "crates/uncareer-core",        # Career progression state and events
    "crates/unprofile-core",       # Player save-file data structures (gameplay progression)
    "crates/unmapload-core",       # Map load protocol events (LoadLevelEvent, LevelLoadedEvent, MapEntitiesReadyEvent)

    # ════════════════════════════════════════════════════════════════════════
    # Tier 2 · Application Layer
    # Game flow, sessions, and mode orchestration.
    # Coordinates the domain; does not express it.
    # ════════════════════════════════════════════════════════════════════════
    "crates/unmission-core",                     # Mission lifecycle data (start/end events)
    "crates/unmission-plugin",
    "crates/uncareer-plugin",                    # Career and economy systems
    "crates/unclassic-mode-gameplay-plugin",     # Phasmo-style ruleset
    "crates/unclassic-mode-orchestrator-plugin", # Ghost selection and level setup
    "crates/uninput-plugin",                     # Physical key → game action binding

    # ════════════════════════════════════════════════════════════════════════
    # Tier 3 · Infrastructure & Adapters
    # External I/O, file formats, and persistence.
    # These are Anti-Corruption Layers (ACL): external data never leaks inward.
    # ════════════════════════════════════════════════════════════════════════

    # ── 3a: Map Pipeline (Tiled ACL) ─────────────────────────────────────
    # Translates on-disk Tiled map data into domain types. Domain is never
    # aware of the Tiled format after this boundary.
    "crates/untmxmap-core",    # High-level map loader and asset indexer
    "crates/untmxmap-plugin",
    "crates/unmapload-plugin",
    "crates/unbehavior",       # ACL: Tiled format → unbehavior-core types (T3 shell)

    # ── 3b: Persistence ──────────────────────────────────────────────────
    "crates/unsettings-plugin",
    "crates/unprofile-plugin",

    # ── 3c: External Network Clients ─────────────────────────────────────
    "crates/unreplicon-transport", # Netcode/auth/procman adapters for Replicon
    "crates/unhub-client",         # HTTP client for the hub server
    "crates/unhub-plugin",

    # ════════════════════════════════════════════════════════════════════════
    # Tier 4 · Presentation (Client-Side Only)
    # Rendering, audio, and UI. Lower tiers must never depend on these.
    # ════════════════════════════════════════════════════════════════════════

    # ── 4a: Rendering ────────────────────────────────────────────────────
    "crates/unrender-std",         # Standalone mesh / material helpers
    "crates/unspatial-plugin",     # Position→Transform isometric projection (PostUpdate)
    "crates/unrender-plugin",      # Main 2D isometric render pipeline and shaders
    "crates/unpicking-core",       # Mouse-to-world picking data
    "crates/unpicking-plugin",     # Visual feedback for interaction picking
    "crates/unghost-presentation", # Ghost: visual hydration, particles, scale glitch (package: unghost-presentation)
    "crates/unlight-presentation", # Light: visual application of LightGrid to sprites/tiles (package: unlight-presentation)

    # ── 4b: Audio ────────────────────────────────────────────────────────
    "crates/unaudiobg-core",        # Ambient and background music data
    "crates/unaudiobg-plugin",
    "crates/unaudiospatial-core",   # Positional SFX data
    "crates/unaudiospatial-plugin",

    # ── 4c: UI ───────────────────────────────────────────────────────────
    "crates/unpause-plugin",               # Pause screen VSA — owns pause UI, keyboard routing, and quit-mission dispatch
    "crates/unmenu-core",                  # Meta-game main-menus common tooling
    "crates/unmenu-plugin",
    "crates/unmainmenu-plugin",            # Title screen
    "crates/uncampaign-plugin",            # Mission selection screen
    "crates/unlobby-core",                 # Multiplayer lobby screen state types
    "crates/unmaphub-core",                # Map hub difficulty selection state types
    "crates/unmaphub-plugin",              # Difficulty selection UI screen (map hub)
    "crates/unlobby-plugin",               # Multiplayer lobby screen
    "crates/unmenusettings-plugin",        # Settings UI
    "crates/unmanual-core",                # Tutorial / field manual data
    "crates/unmanual-plugin",
    "crates/unsummary-plugin",
    "crates/unclassic-mode-render-plugin", # Game-mode-specific visual overrides
    "crates/unclassic-mode-ui-plugin",     # HUD and in-game UI
    "crates/untruckui-plugin",
]
resolver = "3"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.package]
version = "0.3.2-dev"
edition = "2024"
description = "2D isometric Game about investigating paranormal hauntings"
repository = "https://github.com/deavid/unhaunter/"
license = "Apache-2.0"
authors = ["David Martínez Martí <deavidsedice@gmail.com>"]
homepage = "https://unhaunter.com"

[workspace.dependencies]
rand = { version = "0.10", default-features = false, features = [
    "alloc",
    "std_rng",
    "thread_rng",
] }
rand_distr = "0.6"
enum-iterator = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
image = "0.25"
regex = "1.12"
clap = { version = "4.6", features = ["derive"] }
fastapprox = "0.3"
anyhow = "1.0"
thiserror = "2.0"
ordered-float = { version = "5.2", features = ["serde"] }
hierarchical_pathfinding = "0.5"
walkdir = "2.5"
glob = "0.3"
tiled = { version = "0.15", default-features = false }
wasm-bindgen = "0.2"
normalize-path = "0.2"
itertools = "0.14"
csv = "1.4"
dirs = "6.0"
strum = { version = "0.28", features = ["derive"] }
noise = { version = "0.9", features = ["std"] }
bevy = { version = "0.18", features = ["jpeg", "serialize", "debug"] }
# bevy = { version = "0.18", default-features = false, features = [
#     "jpeg",
#     "serialize",
#     "debug",
#     # 2D
#     "2d_bevy_render",
#     "audio",
#     "default_app",
#     "picking",
#     "scene",
#     # UI
#     "ui_api",
#     "ui_bevy_render",
# ] }
bevy_asset_loader = { version = "0.25", features = ["2d"] }
bevy_math = "0.18"
bevy-persistent = { version = "0.10", features = ["all"] }
bevy_platform = "0.18"
bevy_dylib = "0.18"
bevy_picking = "0.18"
ndarray = "0.17"
sha2 = "0.10"
rayon = "1.11"
crossbeam-channel = "0.5"
uuid = { version = "1.23", features = ["v4", "serde"] }
bevy_replicon = "0.39"
bevy_replicon_renet = "0.15"
bevy_renet = { version = "4.0", features = ["netcode"] }
renet = "2.0"
renet_netcode = "2.0"
postcard = { version = "1.1", features = ["alloc"] }
hmac = "0.12"
reqwest = { version = "0.13", features = ["json"] }
axum = "0.8"
tokio = { version = "1.50", features = ["full"] }
dashmap = "6.1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
base64 = "0.22"

# ── Tools ────────────────────────────────────────────────────────────────────
# Development / build-time utilities; not part of the game runtime.
ghost_list = { path = "crates/tools/ghost_list" }
ghost_radio = { path = "crates/tools/ghost_radio" }
unhub = { path = "crates/tools/unhub" }
unprocman = { path = "crates/tools/unprocman" }
walkie_voice_generator = { path = "crates/tools/text_to_speech/walkie_voice_generator" }

# ── Portable Libraries ───────────────────────────────────────────────────────
# Game-agnostic Bevy plugins. Zero Unhaunter-specific knowledge.
# Strong candidates for extraction to crates.io. No -core/-plugin split.
# These are the foundation the tier stack rests on — outside the hexagon.
unfps-plugin = { path = "crates/unfps-plugin" } # Frame-rate limiter via std::thread::sleep

# ════════════════════════════════════════════════════════════════════════════
# Tier 0 · Domain Kernel
# Pure primitives: types, math, and markers.
# Zero internal game dependencies. Dependency arrow points here.
# ════════════════════════════════════════════════════════════════════════════
uncommon-app-core = { path = "crates/uncommon-app-core" }       # Binary-level base tools
unspatial-core = { path = "crates/unspatial-core" }             # Coordinate math (isometric)
unnoise-core = { path = "crates/unnoise-core" }                 # Procedural noise math (Perlin)
unmetrics-core = { path = "crates/unmetrics-core" }             # Performance diagnostic data
unmetrics-plugin = { path = "crates/unmetrics-plugin" }         # Diagnostic systems
unsettings-core = { path = "crates/unsettings-core" }           # Persistent configuration data (pure data, no game deps)
uninvestigation-core = { path = "crates/uninvestigation-core" } # Investigation primitives: evidence and ghost identity enums

# ════════════════════════════════════════════════════════════════════════════
# Tier 1 · Domain Core
# The game's primary domain: its world and rules. Headless-safe.
# Depends only on T0. Each -core/-plugin pair is one bounded context.
# ════════════════════════════════════════════════════════════════════════════

# ── 1a: The Stage (World & Physics) ──────────────────────────────────────
# The persistent physical world that all actors inhabit.

# The Board, the space definition:
unboard-core = { path = "crates/unboard-core" }       # World topology: rooms, walls, collision (defines the space itself)
unboard-plugin = { path = "crates/unboard-plugin" }
unbehavior-core = { path = "crates/unbehavior-core" } # Tile ontology types

# Board fields - values per-tile that have simulations:
unthermal-core = { path = "crates/unthermal-core" }           # Heat convection simulation
unthermal-plugin = { path = "crates/unthermal-plugin" }
unsoundfield-core = { path = "crates/unsoundfield-core" }     # Sound propagation simulation
unsoundfield-plugin = { path = "crates/unsoundfield-plugin" }
unfog-core = { path = "crates/unfog-core" }                   # Miasma fog
unfog-plugin = { path = "crates/unfog-plugin" }
unlight-core = { path = "crates/unlight-core" }               # Illumination model
unlight-plugin = { path = "crates/unlight-plugin" }

# Other:
unnavigation-core = { path = "crates/unnavigation-core" } # Pathfinding graph (data only)
unreplicon-core = { path = "crates/unreplicon-core" }     # Networking / replication
unreplicon-plugin = { path = "crates/unreplicon-plugin" }

# ── 1b: The Actors (Entities & AI) ───────────────────────────────────────
# Everything that inhabits and acts within the stage.
unlocomotion-core = { path = "crates/unlocomotion-core" }       # Locomotion state component
unlocomotion-plugin = { path = "crates/unlocomotion-plugin" }   # Kinematics and movement
unnavigation-plugin = { path = "crates/unnavigation-plugin" }   # Waypoint creation and integration
unghost-core = { path = "crates/unghost-core" }                 # Ghost: evidence, enrage state, AI data
unghost-logic = { path = "crates/unghost-plugin" }
unghost-presentation = { path = "crates/unghost-presentation" }
unplayer-core = { path = "crates/unplayer-core" }               # Player: state, stats, asset handles
unplayer-plugin = { path = "crates/unplayer-plugin" }
uninput-core = { path = "crates/uninput-core" }                 # Input bus (TIER EXCEPTION: T1b despite T2 plugin)
unnpc-core = { path = "crates/unnpc-core" }                     # Helper NPC data (not in workspace members)
unnpc-plugin = { path = "crates/unnpc-plugin" }
unclassic-mode-core = { path = "crates/unclassic-mode-core" }   # Classic mode shared types: camera marker, game colors


# ── 1c: The Mechanics (Gameplay Verbs) ───────────────────────────────────
# How actors interact with the world and each other.
ungear-core = { path = "crates/ungear-core" }                   # Item framework: traits and slots
ungear-plugin = { path = "crates/ungear-plugin" }
ungearitems-core = { path = "crates/ungearitems-core" }         # Concrete items: EMF, thermometer, etc.
ungearitems-plugin = { path = "crates/ungearitems-plugin" }
uninteraction-core = { path = "crates/uninteraction-core" }     # Entity toggling and triggering
uninteraction-plugin = { path = "crates/uninteraction-plugin" }
uninventory-plugin = { path = "crates/uninventory-plugin" }     # Hand / pocket item management
unvitals-core = { path = "crates/unvitals-core" }               # Player health and sanity state
unvitals-plugin = { path = "crates/unvitals-plugin" }           # Health and sanity simulation
undifficulty-core = { path = "crates/undifficulty-core" }       # Difficulty enum and math traits
undifficulty-plugin = { path = "crates/undifficulty-plugin" }
untruck-core = { path = "crates/untruck-core" }                 # Mission loadout and journal state
untruck-plugin = { path = "crates/untruck-plugin" }
unwalkie-types = { path = "crates/unwalkie-types" }             # Walkie shared message types (not in workspace members)
unwalkie-core = { path = "crates/unwalkie-core" }               # Walkie-talkie communication mechanics
unwalkie-logic = { path = "crates/unwalkie-logic" }
unwalkie-plugin = { path = "crates/unwalkie-plugin" }
uncareer-core = { path = "crates/uncareer-core" }               # Career progression state and events
unprofile-core = { path = "crates/unprofile-core" }             # Player save-file data structures (gameplay progression)
unmapload-core = { path = "crates/unmapload-core" }             # Map load protocol: LoadLevelEvent, LevelLoadedEvent, MapEntitiesReadyEvent
uncommon-states-core = { path = "crates/uncommon-states-core" }

# ════════════════════════════════════════════════════════════════════════════
# Tier 2 · Application Layer
# Game flow, sessions, and mode orchestration.
# Coordinates the domain; does not express it.
# ════════════════════════════════════════════════════════════════════════════
unmission-core = { path = "crates/unmission-core" }                                         # Mission lifecycle data (start/end events)
unmission-plugin = { path = "crates/unmission-plugin" }
uncareer-plugin = { path = "crates/uncareer-plugin" }                                       # Career and economy systems
unclassic-mode-gameplay-plugin = { path = "crates/unclassic-mode-gameplay-plugin" }         # Phasmo-style ruleset
unclassic-mode-orchestrator-plugin = { path = "crates/unclassic-mode-orchestrator-plugin" } # Ghost selection and level setup
uninput-plugin = { path = "crates/uninput-plugin" }                                         # Physical key → game action binding
# ════════════════════════════════════════════════════════════════════════════
# Tier 3 · Infrastructure & Adapters
# External I/O, file formats, and persistence.
# These are Anti-Corruption Layers (ACL): external data never leaks inward.
# ════════════════════════════════════════════════════════════════════════════

# ── 3a: Map Pipeline (Tiled ACL) ─────────────────────────────────────────
# Translates on-disk Tiled map data into domain types. Domain is never
# aware of the Tiled format after this boundary.
untmxmap-core = { path = "crates/untmxmap-core" }       # High-level map loader and asset indexer
untmxmap-plugin = { path = "crates/untmxmap-plugin" }
unmapload-plugin = { path = "crates/unmapload-plugin" }
unbehavior = { path = "crates/unbehavior" }             # ACL: Tiled object properties → domain components

# ── 3b: Persistence ──────────────────────────────────────────────────────
unsettings-plugin = { path = "crates/unsettings-plugin" }
unprofile-plugin = { path = "crates/unprofile-plugin" }

# ── 3c: External Network Clients ─────────────────────────────────────────
unreplicon-transport = { path = "crates/unreplicon-transport" } # Netcode/auth/procman adapters for Replicon
unhub-client = { path = "crates/unhub-client" }                 # HTTP client for the hub server
unhub-plugin = { path = "crates/unhub-plugin" }

# ════════════════════════════════════════════════════════════════════════════
# Tier 4 · Presentation (Client-Side Only)
# Rendering, audio, and UI. Lower tiers must never depend on these.
# ════════════════════════════════════════════════════════════════════════════

# ── 4a: Rendering ────────────────────────────────────────────────────────
unrender-std = { path = "crates/unrender-std" }                 # Standalone mesh / material helpers
unspatial-plugin = { path = "crates/unspatial-plugin" }         # Position→Transform isometric projection (PostUpdate)
unrender-plugin = { path = "crates/unrender-plugin" }           # Main 2D isometric render pipeline and shaders
unpicking-core = { path = "crates/unpicking-core" }             # Mouse-to-world picking data
unpicking-plugin = { path = "crates/unpicking-plugin" }         # Visual feedback for interaction picking
unlight-presentation = { path = "crates/unlight-presentation" } # Light: visual application of LightGrid to sprites/tiles

# ── 4b: Audio ────────────────────────────────────────────────────────────
unaudiobg-core = { path = "crates/unaudiobg-core" }               # Ambient and background music data
unaudiobg-plugin = { path = "crates/unaudiobg-plugin" }
unaudiospatial-core = { path = "crates/unaudiospatial-core" }     # Positional SFX data
unaudiospatial-plugin = { path = "crates/unaudiospatial-plugin" }

# ── 4c: UI ───────────────────────────────────────────────────────────────
unpause-plugin = { path = "crates/unpause-plugin" }                             # Pause screen VSA — owns pause UI, keyboard routing, and quit-mission dispatch
unmenu-core = { path = "crates/unmenu-core" }                                   # Meta-game main-menus common tooling
unmenu-plugin = { path = "crates/unmenu-plugin" }
unmainmenu-plugin = { path = "crates/unmainmenu-plugin" }                       # Title screen
uncampaign-plugin = { path = "crates/uncampaign-plugin" }                       # Mission selection screen
unlobby-core = { path = "crates/unlobby-core" }                                 # Multiplayer lobby screen state types
unmaphub-core = { path = "crates/unmaphub-core" }                               # Map hub difficulty selection state types
unmaphub-plugin = { path = "crates/unmaphub-plugin" }                           # Difficulty selection UI screen (map hub)
unlobby-plugin = { path = "crates/unlobby-plugin" }                             # Multiplayer lobby screen
unmenusettings-plugin = { path = "crates/unmenusettings-plugin" }               # Settings UI
unmanual-core = { path = "crates/unmanual-core" }                               # Tutorial / field manual data
unmanual-plugin = { path = "crates/unmanual-plugin" }
unsummary-plugin = { path = "crates/unsummary-plugin" }
untruckui-plugin = { path = "crates/untruckui-plugin" }
unclassic-mode-render-plugin = { path = "crates/unclassic-mode-render-plugin" } # Game-mode-specific visual overrides
unclassic-mode-ui-plugin = { path = "crates/unclassic-mode-ui-plugin" }         # HUD and in-game UI

# winit is not for WASM, and needs to be in sync with bevy version
winit = "0.30"

